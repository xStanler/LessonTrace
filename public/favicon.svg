<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Background Gradient Nocturne -->
    <linearGradient id="ltFavBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171F33"/>
      <stop offset="100%" stop-color="#080E1C"/>
    </linearGradient>

    <!-- Subtle Border Glow -->
    <linearGradient id="ltFavBorder" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4EDEA3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4CD7F6" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Emerald Center Wave -->
    <linearGradient id="ltCenterBar" x1="16" y1="6" x2="16" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6FFBBE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base for High Contrast in Light/Dark Browser Tabs -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#ltFavBg)"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" stroke="url(#ltFavBorder)" stroke-width="1"/>

  <!-- FIXED: Moved layout rendering rules to the parent group element -->
  <g stroke-linecap="round" stroke-width="2.5">
    <line x1="8" y1="16" x2="8" y2="16" stroke="#4EDEA3"/>
    <line x1="12" y1="11" x2="12" y2="21" stroke="#4EDEA3"/>
    <line x1="16" y1="7" x2="16" y2="25" stroke="url(#ltCenterBar)" stroke-width="2.8"/>
    <line x1="20" y1="10" x2="20" y2="22" stroke="#4CD7F6"/>
    <line x1="24" y1="14" x2="24" y2="18" stroke="#4CD7F6" stroke-width="2.2"/>
  </g>

  <!-- AI Synthesis Node Spark -->
  <circle cx="20" cy="8" r="1.5" fill="#ACEDFF"/>
</svg>
