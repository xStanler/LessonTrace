<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <!-- Import Plus Jakarta Sans font -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');

      /* Default / Light Mode Styles */
      .bg-icon { fill: url(#icon-grad); }
      .icon-stroke { stroke: #0b1e19; }
      .text-lesson { fill: #0f172a; }
      .text-trace { fill: #2dd4bf; }

      /* Dark Mode Styles */
      @media (prefers-color-scheme: dark) {
        .text-lesson { fill: #f8fafc; }
        .text-trace { fill: #34d399; }
        .icon-stroke { stroke: #06110f; }
      }
    </style>

    <!-- Original Gradient -->
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <!-- Soft drop shadow for the icon card -->
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#11998e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Icon Container -->
  <g transform="translate(10, 10)" filter="url(#icon-shadow)">
    <!-- Standard Rounded App Card Background -->
    <rect width="70" height="70" rx="18" class="bg-icon" />

    <!-- Perfectly Centered & Widened Document Graphic (Equal margins & left-only rounded) -->
    <g transform="translate(13, 15)" class="icon-stroke" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- Document outline -->
      <path d="M 9 2 
               L 29 2 
               L 29 38 
               L 9 38 
               A 6 6 0 0 1 3 32
               L 3 8
               A 6 6 0 0 1 9 2 Z" />
      <!-- Inner text lines -->
      <line x1="9" y1="11" x2="23" y2="11" />
      <line x1="9" y1="18" x2="23" y2="18" />
      <line x1="9" y1="25" x2="17" y2="25" />
    </g>
  </g>

  <!-- Typography: LessonTrace (Plus Jakarta Sans) -->
  <text x="100" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">
    <tspan class="text-lesson">Lesson</tspan><tspan class="text-trace">Trace</tspan>
  </text>
</svg>

